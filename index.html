<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #fafafa;
  --card: #fff;
  --text: #111;
  --muted: #737373;
  --border: #dbdbdb;
  --button: #0095f6;
  --input: #f5f5f5;
  --danger: #ed4956;
  --overlay: rgba(0,0,0,.72);
  --shadow: 0 10px 35px rgba(0,0,0,.2);
}

body.dark {
  --bg: #000;
  --card: #121212;
  --text: #f5f5f5;
  --muted: #a8a8a8;
  --border: #363636;
  --input: #1c1c1c;
  --shadow: 0 10px 35px rgba(0,0,0,.55);
}

html,
body {
  min-height: 100%;
}

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

img {
  display: block;
  max-width: 100%;
}


/* =========================================
   TOP BAR
========================================= */

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;

  height: 60px;

  background: var(--card);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  width: min(975px, 100%);
  height: 100%;

  margin: auto;
  padding: 0 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.7px;
}

.brand span {
  font-weight: 400;
}

.top-actions {
  display: flex;
  gap: 6px;
}

.icon-btn {
  width: 40px;
  height: 40px;

  border: 0;
  border-radius: 50%;

  background: transparent;
  color: var(--text);

  font-size: 22px;
}

.icon-btn:hover {
  background: var(--input);
}


/* =========================================
   MAIN
========================================= */

main {
  width: min(975px, 100%);
  margin: auto;
  padding: 20px 20px 80px;
}


/* =========================================
   PROFILE
========================================= */

.profile-header {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 55px;

  padding: 25px 20px 30px;
}

.avatar-wrapper {
  display: flex;
  justify-content: center;
}

.avatar,
.avatar-placeholder {
  width: 150px;
  height: 150px;

  border-radius: 50%;

  border: 3px solid var(--card);
  outline: 1px solid var(--border);
}

.avatar {
  object-fit: cover;
}

.avatar-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #833ab4,
      #fd1d1d,
      #fcb045
    );

  color: white;

  font-size: 45px;
  font-weight: 700;
}

.profile-info {
  min-width: 0;
}

.profile-top {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;

  margin-bottom: 20px;
}

.username {
  font-size: 28px;
  font-weight: 400;
}

.profile-buttons {
  display: flex;
  gap: 8px;
}

.btn {
  border: 0;
  border-radius: 8px;

  padding: 8px 18px;

  background: var(--input);
  color: var(--text);

  font-size: 14px;
  font-weight: 600;
}

.btn:hover {
  opacity: .85;
}

.btn-primary {
  background: var(--button);
  color: white;
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.stats {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 28px;

  margin-bottom: 20px;

  font-size: 15px;
}

.stat strong {
  font-weight: 700;
}

.bio-name {
  margin-bottom: 4px;
  font-weight: 700;
}

.bio {
  max-width: 550px;
  white-space: pre-wrap;
  line-height: 1.45;
}

.private-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;

  margin-top: 12px;

  color: var(--muted);
  font-size: 12px;
}


/* =========================================
   STORIES
========================================= */

.stories-section {
  padding: 5px 5px 25px;

  overflow-x: auto;

  scrollbar-width: none;
}

.stories-section::-webkit-scrollbar {
  display: none;
}

.stories-list {
  display: flex;
  gap: 18px;

  width: max-content;
}

.story-item {
  width: 76px;

  border: 0;
  background: transparent;

  color: var(--text);

  text-align: center;
}

.story-ring {
  width: 70px;
  height: 70px;

  margin: auto;

  padding: 3px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #feda75,
      #fa7e1e,
      #d62976,
      #962fbf,
      #4f5bd5
    );
}

.story-ring-inner {
  width: 100%;
  height: 100%;

  padding: 3px;

  border-radius: 50%;

  background: var(--card);
}

.story-image {
  width: 100%;
  height: 100%;

  border-radius: 50%;

  object-fit: cover;
}

.story-label {
  display: block;

  margin-top: 7px;

  overflow: hidden;

  font-size: 12px;

  text-overflow: ellipsis;
  white-space: nowrap;
}

.add-story .story-ring {
  background: var(--border);
}

.add-story-inner {
  width: 100%;
  height: 100%;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--card);

  font-size: 30px;
}

.story-delete {
  display: none;
}


/* =========================================
   POSTS NAV
========================================= */

.posts-nav {
  display: flex;
  justify-content: center;
  gap: 70px;

  border-top: 1px solid var(--border);
}

.posts-nav button {
  position: relative;

  height: 52px;

  border: 0;
  background: transparent;

  color: var(--muted);

  font-size: 12px;
  font-weight: 600;
  letter-spacing: .5px;
}

.posts-nav button.active {
  color: var(--text);
}

.posts-nav button.active::before {
  content: "";

  position: absolute;
  top: -1px;
  left: 0;
  right: 0;

  height: 1px;

  background: var(--text);
}


/* =========================================
   POSTS
========================================= */

.post-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}

.post {
  position: relative;

  aspect-ratio: 1 / 1;

  overflow: hidden;

  background: var(--input);

  cursor: pointer;
}

.post > img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  transition: transform .25s;
}

.post:hover > img {
  transform: scale(1.035);
}

.post-multiple {
  position: absolute;

  top: 9px;
  right: 10px;

  z-index: 2;

  color: white;

  font-size: 19px;

  text-shadow: 0 1px 5px #000;
}

.post-overlay {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;

  background: rgba(0,0,0,.48);

  color: white;

  opacity: 0;

  transition: opacity .2s;
}

.post:hover .post-overlay {
  opacity: 1;
}

.text-post {
  width: 100%;
  height: 100%;

  padding: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  background:
    linear-gradient(
      135deg,
      #833ab4,
      #fd1d1d
    );

  color: white;

  font-size: 20px;
  font-weight: 600;
}


/* =========================================
   EMPTY
========================================= */

.empty {
  grid-column: 1 / -1;

  padding: 80px 20px;

  text-align: center;
}

.empty-icon {
  width: 65px;
  height: 65px;

  margin: 0 auto 20px;

  border: 2px solid var(--text);
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 30px;
}

.empty h2 {
  margin-bottom: 8px;
}

.empty p {
  margin-bottom: 20px;

  color: var(--muted);
}


/* =========================================
   MODALS
========================================= */

.modal-backdrop {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: var(--overlay);
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: min(520px, 100%);
  max-height: 92vh;

  overflow-y: auto;

  background: var(--card);

  border-radius: 12px;

  box-shadow: var(--shadow);
}

.modal-header {
  min-height: 55px;

  padding: 0 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid var(--border);
}

.modal-header h2 {
  font-size: 16px;
}

.close-btn {
  border: 0;
  background: transparent;

  color: var(--text);

  font-size: 27px;
}

.modal-body {
  padding: 25px;
}

.modal-footer {
  padding: 15px 25px;

  display: flex;
  justify-content: flex-end;
  gap: 10px;

  border-top: 1px solid var(--border);
}


/* =========================================
   FORMS
========================================= */

.form-group {
  margin-bottom: 18px;
}

.form-group label:not(.file-label) {
  display: block;

  margin-bottom: 7px;

  font-size: 13px;
  font-weight: 600;
}

.form-control {
  width: 100%;

  padding: 11px 12px;

  border: 1px solid var(--border);
  border-radius: 7px;

  outline: none;

  background: var(--input);
  color: var(--text);
}

.form-control:focus {
  border-color: var(--muted);
}

textarea.form-control {
  min-height: 100px;
  resize: vertical;
}

.file-label {
  display: block;

  padding: 25px;

  border: 1px dashed var(--border);
  border-radius: 10px;

  text-align: center;

  color: var(--muted);

  cursor: pointer;
}

.file-label:hover {
  background: var(--input);
}

.file-label input {
  display: none;
}


/* =========================================
   PREVIEWS
========================================= */

.preview {
  display: none;

  margin-top: 15px;
}

.preview.show {
  display: block;
}

.preview img {
  width: 100%;
  max-height: 300px;

  object-fit: contain;

  border-radius: 8px;

  background: var(--input);
}

.multi-preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;

  margin-top: 15px;
}

.multi-preview img {
  width: 100%;
  aspect-ratio: 1;

  object-fit: cover;

  border-radius: 6px;
}


/* =========================================
   POST DETAIL
========================================= */

.post-detail {
  width: min(900px, 100%);
}

.post-detail-content {
  display: grid;
  grid-template-columns: 1fr 320px;

  min-height: 450px;
}

.post-carousel {
  position: relative;

  min-height: 450px;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  touch-action: pan-y;
}

.carousel-image {
  width: 100%;
  height: 100%;

  max-height: 650px;

  object-fit: contain;
}

.carousel-arrow {
  position: absolute;

  top: 50%;

  width: 36px;
  height: 36px;

  transform: translateY(-50%);

  border: 0;
  border-radius: 50%;

  background: rgba(255,255,255,.88);
  color: #111;

  font-size: 22px;

  z-index: 5;
}

.carousel-prev {
  left: 12px;
}

.carousel-next {
  right: 12px;
}

.carousel-counter {
  position: absolute;

  top: 12px;
  left: 50%;

  transform: translateX(-50%);

  padding: 5px 10px;

  border-radius: 20px;

  background: rgba(0,0,0,.65);

  color: white;

  font-size: 12px;

  z-index: 5;
}

.carousel-dots {
  position: absolute;

  bottom: 12px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;
  gap: 5px;

  z-index: 5;
}

.carousel-dot {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: rgba(255,255,255,.5);
}

.carousel-dot.active {
  background: white;
}

.post-detail-info {
  padding: 20px;

  display: flex;
  flex-direction: column;
}

.post-detail-caption {
  margin-top: 20px;

  line-height: 1.5;

  white-space: pre-wrap;
}

.post-detail-likes {
  margin-top: 15px;

  font-weight: 600;
}

.post-detail-date {
  margin-top: auto;
  padding-top: 20px;

  color: var(--muted);

  font-size: 12px;
}


/* =========================================
   STORY VIEWER
========================================= */

.story-viewer {
  position: relative;

  width: min(430px, 100%);
  height: min(760px, 90vh);

  overflow: hidden;

  background: #000;

  border-radius: 12px;

  box-shadow: var(--shadow);
}

.story-viewer-image {
  width: 100%;
  height: 100%;

  object-fit: contain;

  background: #000;
}

.story-top {
  position: absolute;

  top: 12px;
  left: 12px;
  right: 12px;

  z-index: 10;
}

.story-progress {
  display: flex;
  gap: 4px;

  width: 100%;
}

.story-progress-bar {
  flex: 1;

  height: 3px;

  border-radius: 10px;

  background: rgba(255,255,255,.4);

  overflow: hidden;
}

.story-progress-bar.active {
  background: white;
}

.story-viewer-user {
  display: flex;
  align-items: center;
  gap: 8px;

  margin-top: 12px;

  color: white;

  font-size: 13px;
  font-weight: 600;

  text-shadow: 0 1px 4px #000;
}

.story-viewer-avatar {
  width: 32px;
  height: 32px;

  border-radius: 50%;

  object-fit: cover;

  border: 2px solid white;
}

.story-caption {
  position: absolute;

  left: 20px;
  right: 20px;
  bottom: 35px;

  z-index: 10;

  color: white;

  text-align: center;

  font-size: 16px;
  line-height: 1.45;

  text-shadow: 0 1px 5px #000;

  white-space: pre-wrap;
}

.story-nav {
  position: absolute;
  inset: 0;

  display: flex;

  z-index: 5;
}

.story-nav-left,
.story-nav-right {
  width: 50%;
  height: 100%;

  border: 0;

  background: transparent;
}

.story-close {
  position: absolute;

  top: 35px;
  right: 15px;

  z-index: 20;

  width: 35px;
  height: 35px;

  border: 0;
  border-radius: 50%;

  background: rgba(0,0,0,.4);

  color: white;

  font-size: 25px;
}

.story-delete-btn {
  position: absolute;

  right: 18px;
  bottom: 18px;

  z-index: 20;

  padding: 8px 12px;

  border: 0;
  border-radius: 7px;

  background: rgba(0,0,0,.65);

  color: white;

  font-size: 12px;
}


/* =========================================
   TOAST
========================================= */

.toast {
  position: fixed;

  bottom: 25px;
  left: 50%;

  z-index: 300;

  transform:
    translateX(-50%)
    translateY(20px);

  padding: 12px 18px;

  border-radius: 8px;

  background: #262626;
  color: white;

  font-size: 14px;

  opacity: 0;

  pointer-events: none;

  transition: .25s;
}

.toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

  main {
    padding: 5px 0 60px;
  }

  .profile-header {
    grid-template-columns: 90px 1fr;

    gap: 20px;

    padding: 20px 15px 25px;
  }

  .avatar,
  .avatar-placeholder {
    width: 80px;
    height: 80px;

    font-size: 27px;
  }

  .username {
    font-size: 20px;
  }

  .profile-top {
    gap: 10px;

    margin-bottom: 12px;
  }

  .profile-buttons {
    width: 100%;
  }

  .profile-buttons .btn {
    flex: 1;
  }

  .stats {
    gap: 14px;

    font-size: 13px;

    margin-bottom: 12px;
  }

  .posts-nav {
    gap: 45px;
  }

  .post-grid {
    gap: 2px;
  }

  .post-detail-content {
    grid-template-columns: 1fr;
  }

  .post-carousel {
    min-height: 350px;
  }

  .post-detail-info {
    min-height: 250px;
  }

  .story-viewer {
    width: 100%;
    height: 100vh;
    max-height: none;
    border-radius: 0;
  }
}

/* Like button heart animation */
.like-burst{position:absolute;left:50%;top:50%;pointer-events:none;font-size:72px;line-height:1;transform:translate(-50%,-50%) scale(.2);opacity:0;z-index:50;animation:likeHeartBurst .8s cubic-bezier(.17,.67,.3,1.35) forwards;filter:drop-shadow(0 4px 12px rgba(0,0,0,.18))}
@keyframes likeHeartBurst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}18%{transform:translate(-50%,-50%) scale(1.25);opacity:1}42%{transform:translate(-50%,-50%) scale(.95);opacity:1}100%{transform:translate(-50%,-50%) scale(1.35);opacity:0}}
.like-button-pop{animation:likeButtonPop .35s ease-out}
@keyframes likeButtonPop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}

</style>
</head>


<body>

<!-- =========================================
     TOP BAR
========================================= -->

<header class="topbar">

  <div class="topbar-inner">

    <div class="brand">
      My<span>Profile</span>
    </div>

    <div class="top-actions">

      <button
        class="icon-btn"
        id="addStoryTop"
        title="Add story"
        type="button"
      >
        ◎
      </button>

      <button
        class="icon-btn"
        id="addPostTop"
        title="Create post"
        type="button"
      >
        ＋
      </button>

      <button
        class="icon-btn"
        id="themeToggle"
        title="Toggle theme"
        type="button"
      >
        ☾
      </button>

    </div>

  </div>

</header>


<!-- =========================================
     MAIN
========================================= -->

<main>

  <!-- PROFILE -->

  <section class="profile-header">

    <div
      class="avatar-wrapper"
      id="avatarContainer"
    ></div>


    <div class="profile-info">

      <div class="profile-top">

        <h1
          class="username"
          id="usernameDisplay"
        >
          username
        </h1>


        <div class="profile-buttons">

          <button
            class="btn"
            id="editProfileBtn"
            type="button"
          >
            Edit profile
          </button>

          <button
            class="btn btn-primary"
            id="addPostBtn"
            type="button"
          >
            Add post
          </button>

        </div>

      </div>


      <div class="stats">

        <div class="stat">
          <strong id="postCount">0</strong>
          posts
        </div>

        <div class="stat">
          <strong id="followersCount">17K</strong>
          followers
        </div>

        <div class="stat">
          <strong id="followingCount">851</strong>
          following
        </div>

      </div>


      <div
        class="bio-name"
        id="nameDisplay"
      >
        Your Name
      </div>


      <div
        class="bio"
        id="bioDisplay"
      >
        Welcome to my private profile. ✨
      </div>


      <div class="private-label">
        🔒 Private — saved only on this browser
      </div>

    </div>

  </section>


  <!-- =======================================
       STORIES
  ======================================== -->

  <section class="stories-section">

    <div
      class="stories-list"
      id="storiesList"
    ></div>

  </section>


  <!-- POSTS NAV -->

  <div class="posts-nav">

    <button
      class="active"
      type="button"
    >
      ▦ POSTS
    </button>

    <button type="button">
      👤 PROFILE
    </button>

  </div>


  <!-- POSTS -->

  <section
    class="post-grid"
    id="postGrid"
  ></section>

</main>


<!-- =========================================
     EDIT PROFILE MODAL
========================================= -->

<div
  class="modal-backdrop"
  id="profileModal"
>

  <div class="modal">

    <div class="modal-header">

      <h2>Edit profile</h2>

      <button
        class="close-btn"
        data-close="profileModal"
        type="button"
      >
        ×
      </button>

    </div>


    <form id="profileForm">

      <div class="modal-body">

        <div class="form-group">

          <label for="profileName">
            Name
          </label>

          <input
            class="form-control"
            id="profileName"
            maxlength="50"
            placeholder="Your name"
            autocomplete="off"
          >

        </div>


        <div class="form-group">

          <label for="profileUsername">
            Username
          </label>

          <input
            class="form-control"
            id="profileUsername"
            maxlength="30"
            placeholder="username"
            autocomplete="off"
          >

        </div>


        <div class="form-group">

          <label for="profileBio">
            Bio
          </label>

          <textarea
            class="form-control"
            id="profileBio"
            maxlength="150"
            placeholder="Tell people about yourself..."
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Profile picture
          </label>

          <label class="file-label">

            📷 Choose profile picture

            <input
              type="file"
              id="profileImage"
              accept="image/*"
            >

          </label>


          <div
            class="preview"
            id="profilePreview"
          >

            <img
              id="profilePreviewImage"
              alt="Profile preview"
            >

          </div>

        </div>

      </div>


      <div class="modal-footer">

        <button
          type="button"
          class="btn"
          data-close="profileModal"
        >
          Cancel
        </button>

<script>

/* =================================================
   STORAGE
================================================= */

const PROFILE_KEY =
  "private_profile_data_v5";

const POSTS_KEY =
  "private_profile_posts_v5";

const STORIES_KEY =
  "private_profile_stories_v1";

const THEME_KEY =
  "private_profile_theme_v5";


/* =================================================
   DEFAULT PROFILE
================================================= */

const defaultProfile = {
  name: "Your Name",
  username: "username",
  bio: "Welcome to my private profile. ✨",
  avatar: null,
  followers: 17000,
  following: 851
};


/* =================================================
   STORAGE HELPERS
================================================= */

function readJSON(key) {

  try {

    const value =
      localStorage.getItem(key);

    if (!value)
      return null;

    return JSON.parse(value);

  } catch {

    return null;

  }

}


function writeJSON(key, value) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

    return true;

  } catch (error) {

    console.error(
      "Storage error:",
      error
    );

    showToast(
      "Browser storage is full. Try using smaller pictures."
    );

    return false;

  }

}


/* =================================================
   PROFILE
================================================= */

function getProfile() {

  let saved =
    readJSON(
      PROFILE_KEY
    );


  if (!saved) {

    saved =
      readJSON(
        "private_profile_data_v4"
      );

  }


  if (!saved) {

    saved =
      readJSON(
        "private_profile_data_v3"
      );

  }


  const profile = {
    ...defaultProfile,
    ...(saved || {})
  };


  if (
    typeof profile.followers !==
    "number"
  ) {

    profile.followers =
      17000;

  }


  if (
    typeof profile.following !==
    "number"
  ) {

    profile.following =
      851;

  }


  writeJSON(
    PROFILE_KEY,
    profile
  );


  return profile;

}


/* =================================================
   POSTS
================================================= */

function randomPostViews() {

  let views;

  do {
    views =
      Math.floor(
        Math.random() *
        (70000 - 10000 + 1)
      ) +
      10000;

  } while (views % 10 === 0);

  return views;

}


function normalizePost(post) {

  let images = [];


  if (
    Array.isArray(
      post.images
    )
  ) {

    images =
      post.images.filter(Boolean);

  } else if (
    post.image
  ) {

    images = [
      post.image
    ];

  }


  return {

    id:
      post.id ||
      Date.now().toString(),

    images:
      images,

    caption:
      post.caption || "",

    likes:
      Number(post.likes) || 0,

    views:
      (
        Number.isFinite(
          Number(post.views)
        ) &&
        Number(post.views) >= 10000 &&
        Number(post.views) <= 70000 &&
        Number(post.views) % 10 !== 0
      )
        ? Number(post.views)
        : randomPostViews(),

    createdAt:
      post.createdAt ||
      new Date().toISOString()

  };

}


function getPosts() {

  let posts =
    readJSON(
      POSTS_KEY
    );


  if (!Array.isArray(posts)) {

    posts =
      readJSON(
        "private_profile_posts_v4"
      );

  }


  if (!Array.isArray(posts)) {

    posts =
      readJSON(
        "private_profile_posts_v3"
      );

  }


  if (!Array.isArray(posts)) {

    posts = [];

  }


  posts =
    posts.map(
      normalizePost
    );


  writeJSON(
    POSTS_KEY,
    posts
  );


  return posts;

}


function savePosts(posts) {

  return writeJSON(
    POSTS_KEY,
    posts.map(
      normalizePost
    )
  );

}


/* =================================================
   STORIES
================================================= */

function cleanStories() {

  let stories =
    readJSON(
      STORIES_KEY
    );


  if (!Array.isArray(stories)) {

    stories = [];

  }


  const now =
    Date.now();


  /*
     Remove stories older than 24 hours.
  */

  stories =
    stories.filter(
      story => {

        return (
          now -
          Number(story.createdAt)
        ) <
        24 * 60 * 60 * 1000;

      }
    );


  writeJSON(
    STORIES_KEY,
    stories
  );


  return stories;

}


function getStories() {

  return cleanStories();

}


function saveStories(stories) {

  return writeJSON(
    STORIES_KEY,
    stories
  );

}


/* =================================================
   ELEMENTS
================================================= */

const avatarContainer =
  document.getElementById(
    "avatarContainer"
  );

const usernameDisplay =
  document.getElementById(
    "usernameDisplay"
  );

const nameDisplay =
  document.getElementById(
    "nameDisplay"
  );

const bioDisplay =
  document.getElementById(
    "bioDisplay"
  );

const postCount =
  document.getElementById(
    "postCount"
  );

const followersCount =
  document.getElementById(
    "followersCount"
  );

const followingCount =
  document.getElementById(
    "followingCount"
  );

const postGrid =
  document.getElementById(
    "postGrid"
  );

const storiesList =
  document.getElementById(
    "storiesList"
  );

const toast =
  document.getElementById(
    "toast"
  );


/* =================================================
   NUMBER FORMAT
================================================= */

function formatCount(number) {

  number =
    Number(number) || 0;


  if (number >= 1000000) {

    const value =
      number / 1000000;

    return (
      value
        .toFixed(
          value % 1 === 0
            ? 0
            : 1
        )
      + "M"
    );

  }


  if (number >= 1000) {

    const value =
      number / 1000;

    return (
      value
        .toFixed(
          value % 1 === 0
            ? 0
            : 1
        )
      + "K"
    );

  }


  return number.toLocaleString();

}


/* =================================================
   RENDER PROFILE
================================================= */

function renderProfile() {

  const profile =
    getProfile();


  usernameDisplay.textContent =
    profile.username ||
    "username";


  nameDisplay.textContent =
    profile.name ||
    "Your Name";


  bioDisplay.textContent =
    profile.bio ||
    "Add a bio to your profile.";


  followersCount.textContent =
    formatCount(
      profile.followers
    );


  followingCount.textContent =
    formatCount(
      profile.following
    );


  if (profile.avatar) {

    avatarContainer.innerHTML = `

      <img
        class="avatar"
        src="${profile.avatar}"
        alt="Profile picture"
      >

    `;

  } else {

    avatarContainer.innerHTML = `

      <div class="avatar-placeholder">
        ${escapeHTML(
          getInitials(
            profile.name
          )
        )}
      </div>

    `;

  }


  postCount.textContent =
    getPosts().length;

}


/* =================================================
   RENDER STORIES
================================================= */

function renderStories() {

  const stories =
    getStories();


  storiesList.innerHTML = "";


  /*
     Always show Add Story.
  */

  const add =
    document.createElement(
      "button"
    );


  add.className =
    "story-item add-story";


  add.type =
    "button";


  add.innerHTML = `

    <div class="story-ring">

      <div class="story-ring-inner">

        <div class="add-story-inner">
          ＋
        </div>

      </div>

    </div>

    <span class="story-label">
      Your story
    </span>

  `;


  add.addEventListener(
    "click",
    openStoryCreate
  );


  storiesList.appendChild(
    add
  );


  /*
     Show each active story.
  */

  stories.forEach(
    story => {

      const item =
        document.createElement(
          "button"
        );


      item.className =
        "story-item";


      item.type =
        "button";


      item.innerHTML = `

        <div class="story-ring">

          <div class="story-ring-inner">

            <img
              class="story-image"
              src="${story.images[0]}"
              alt="Story"
            >

          </div>

        </div>

        <span class="story-label">
          Your story
        </span>

      `;


      item.addEventListener(
        "click",
        () => {

          openStoryViewer(
            story.id
          );

        }
      );


      storiesList.appendChild(
        item
      );

    }
  );

}


/* =================================================
   RENDER POSTS
================================================= */

function renderPosts() {

  const posts =
    getPosts();


  postGrid.innerHTML = "";


  if (!posts.length) {

    postGrid.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📷
        </div>

        <h2>
          Share your first photo
        </h2>

        <p>
          When you add posts,
          they'll appear here.
        </p>

        <button
          class="btn btn-primary"
          id="emptyAddPost"
          type="button"
        >
          Add your first post
        </button>

      </div>

    `;


    document
      .getElementById(
        "emptyAddPost"
      )
      .addEventListener(
        "click",
        openPostModal
      );


    return;

  }


  posts.forEach(
    post => {

      const element =
        document.createElement(
          "article"
        );


      element.className =
        "post";


      const images =
        post.images || [];


      if (images[0]) {

        const image =
          document.createElement(
            "img"
          );


        image.src =
          images[0];

        image.alt =
          post.caption ||
          "Post";

        image.loading =
          "lazy";


        element.appendChild(
          image
        );

      } else {

        const text =
          document.createElement(
            "div"
          );


        text.className =
          "text-post";

        text.textContent =
          post.caption ||
          "Post";


        element.appendChild(
          text
        );

      }


      if (
        images.length > 1
      ) {

        const multiple =
          document.createElement(
            "div"
          );


        multiple.className =
          "post-multiple";

        multiple.textContent =
          "▧";


        element.appendChild(
          multiple
        );

      }


      const overlay =
        document.createElement(
          "div"
        );


      overlay.className =
        "post-overlay";


      overlay.innerHTML = `

        <span>
          ♥ ${formatCount(post.likes)}
        </span>

        <span>
          👁 ${formatCount(post.views)}
        </span>

        <span>
          ${
            images.length > 1
              ? "📷 " + images.length
              : "📷"
          }
        </span>

      `;


      element.appendChild(
        overlay
      );


      element.addEventListener(
        "click",
        () => {

          openPostDetail(
            post.id
          );

        }
      );


      postGrid.appendChild(
        element
      );

    }
  );

}


/* =================================================
   RENDER EVERYTHING
================================================= */

function render() {

  renderProfile();

  renderStories();

  renderPosts();

}


/* =================================================
   PROFILE EDIT
================================================= */

let newAvatar = null;


document
  .getElementById(
    "editProfileBtn"
  )
  .addEventListener(
    "click",
    () => {

      const profile =
        getProfile();


      document.getElementById(
        "profileName"
      ).value =
        profile.name || "";


      document.getElementById(
        "profileUsername"
      ).value =
        profile.username || "";


      document.getElementById(
        "profileBio"
      ).value =
        profile.bio || "";


      newAvatar =
        null;


      const preview =
        document.getElementById(
          "profilePreview"
        );


      if (profile.avatar) {

        document.getElementById(
          "profilePreviewImage"
        ).src =
          profile.avatar;

        preview.classList.add(
          "show"
        );

      } else {

        preview.classList.remove(
          "show"
        );

      }


      openModal(
        "profileModal"
      );

    }
  );


/* =================================================
   PROFILE IMAGE
================================================= */

document
  .getElementById(
    "profileImage"
  )
  .addEventListener(
    "change",
    async function() {

      const file =
        this.files[0];


      if (!file)
        return;


      try {

        newAvatar =
          await resizeImage(
            file,
            600
          );


        document.getElementById(
          "profilePreviewImage"
        ).src =
          newAvatar;


        document.getElementById(
          "profilePreview"
        ).classList.add(
          "show"
        );

      } catch {

        showToast(
          "Could not load that picture."
        );

      }

    }
  );


/* =================================================
   SAVE PROFILE
================================================= */

document
  .getElementById(
    "profileForm"
  )
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();


      const profile =
        getProfile();


      profile.name =
        document.getElementById(
          "profileName"
        ).value.trim()
        ||
        "Your Name";


      profile.username =
        document.getElementById(
          "profileUsername"
        ).value
        .trim()
        .replace(
          /\s+/g,
          ""
        )
        .replace(
          /^@/,
          ""
        )
        .toLowerCase()
        ||
        "username";


      /*
         This is the important part:
         the bio is saved every time
         Save changes is pressed.
      */

      profile.bio =
        document.getElementById(
          "profileBio"
        ).value;


      if (
        newAvatar !== null
      ) {

        profile.avatar =
          newAvatar;

      }


      if (
        !writeJSON(
          PROFILE_KEY,
          profile
        )
      ) {

        return;

      }


      newAvatar =
        null;


      closeModal(
        "profileModal"
      );


      render();


      showToast(
        "Profile saved!"
      );

    }
  );


/* =================================================
   CREATE POST
================================================= */

let selectedPostImages = [];


document
  .getElementById(
    "addPostBtn"
  )
  .addEventListener(
    "click",
    openPostModal
  );


document
  .getElementById(
    "addPostTop"
  )
  .addEventListener(
    "click",
    openPostModal
  );


function openPostModal() {

  selectedPostImages =
    [];


  document
    .getElementById(
      "postForm"
    )
    .reset();


  document.getElementById(
    "postPreview"
  ).innerHTML =
    "";


  openModal(
    "postModal"
  );

}


/* =================================================
   POST IMAGES
================================================= */

document
  .getElementById(
    "postImage"
  )
  .addEventListener(
    "change",
    async function() {

      const files =
        Array.from(
          this.files
        );


      if (!files.length)
        return;


      const button =
        document.getElementById(
          "sharePostBtn"
        );


      button.disabled =
        true;

      button.textContent =
        "Loading...";


      try {

        selectedPostImages =
          await Promise.all(
            files.map(
              file =>
                resizeImage(
                  file,
                  1400
                )
            )
          );


        renderPostPreview();

      } catch {

        selectedPostImages =
          [];

        showToast(
          "Could not load one of the pictures."
        );

      }


      button.disabled =
        false;

      button.textContent =
        "Share";

    }
  );


function renderPostPreview() {

  const preview =
    document.getElementById(
      "postPreview"
    );


  preview.innerHTML =
    "";


  selectedPostImages.forEach(
    (image, index) => {

      const img =
        document.createElement(
          "img"
        );


      img.src =
        image;


      img.alt =
        `Selected image ${index + 1}`;


      preview.appendChild(
        img
      );

    }
  );

}


/* =================================================
   SHARE POST
================================================= */

document
  .getElementById(
    "postForm"
  )
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();


      if (
        selectedPostImages.length ===
        0
      ) {

        showToast(
          "Choose at least one picture."
        );

        return;

      }


      const posts =
        getPosts();


      const post = {

        id:
          Date.now().toString()
          +
          "-"
          +
          Math.random()
            .toString(36)
            .slice(2),

        images:
          [...selectedPostImages],

        caption:
          document.getElementById(
            "postCaption"
          ).value,

        likes:
          0,

        views:
          randomPostViews(),

        createdAt:
          new Date().toISOString()

      };


      posts.unshift(
        post
      );


      /*
         Save the post before
         closing the modal.
      */

      if (
        !savePosts(posts)
      ) {

        return;

      }


      selectedPostImages =
        [];


      closeModal(
        "postModal"
      );


      render();


      showToast(
        "Post shared!"
      );

    }
  );


/* =================================================
   STORY CREATION
================================================= */

let selectedStoryImages = [];


document
  .getElementById(
    "addStoryTop"
  )
  .addEventListener(
    "click",
    openStoryCreate
  );


function openStoryCreate() {

  selectedStoryImages =
    [];


  document
    .getElementById(
      "storyForm"
    )
    .reset();


  document.getElementById(
    "storyPreview"
  ).innerHTML =
    "";


  openModal(
    "storyCreateModal"
  );

}


/* =================================================
   STORY IMAGE SELECTION
================================================= */

document
  .getElementById(
    "storyImage"
  )
  .addEventListener(
    "change",
    async function() {

      const files =
        Array.from(
          this.files
        );


      if (!files.length)
        return;


      const button =
        document.getElementById(
          "shareStoryBtn"
        );


      button.disabled =
        true;

      button.textContent =
        "Loading...";


      try {

        selectedStoryImages =
          await Promise.all(
            files.map(
              file =>
                resizeImage(
                  file,
                  1400
                )
            )
          );


        renderStoryPreview();

      } catch {

        selectedStoryImages =
          [];

        showToast(
          "Could not load one of the pictures."
        );

      }


      button.disabled =
        false;

      button.textContent =
        "Add to story";

    }
  );


function renderStoryPreview() {

  const preview =
    document.getElementById(
      "storyPreview"
    );


  preview.innerHTML =

  selectedStoryImages.forEach(
    (image, index) => {

      const img =
        document.createElement(

        );


      img.src =

/* =================================================
   SAVE STORY
================================================= */

document
  .getElementById(
    "storyForm"
  )
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();


      if (
        selectedStoryImages.length ===
        0
      ) {

        showToast(
          "Choose at least one picture."
        );

        return;

      }


      const stories =
        getStories();


      const story = {

        id:
          Date.now().toString()
          +
          "-"
          +
          Math.random()
            .toString(36)
            .slice(2),

        images:
          [...selectedStoryImages],

        caption:
          document.getElementById(
            "storyCaption"
          ).value,

        createdAt:
          Date.now()

      };


      stories.push(
        story
      );


      /*
         Story is saved permanently
         until its 24-hour expiration.
      */

      if (
        !saveStories(
          stories
        )
      ) {

        return;

      }


      selectedStoryImages =
        [];


      closeModal(
        "storyCreateModal"
      );


      renderStories();


      showToast(
        "Added to your story!"
      );

    }
  );


/* =================================================
   STORY VIEWER
================================================= */

let currentStoryId = null;
let currentStoryIndex = 0;


function openStoryViewer(
  storyId
) {

  const stories =
    getStories();


  const story =
    stories.find(
      item =>
        item.id === storyId
    );


  if (!story)
    return;


  currentStoryId =
    storyId;


  currentStoryIndex =
    0;


  renderStoryViewer();


  openModal(
    "storyViewerModal"
  );

}


function renderStoryViewer() {

  const stories =
    getStories();


  const story =
    stories.find(
      item =>
        item.id ===
        currentStoryId
    );


  if (!story) {

    closeModal(
      "storyViewerModal"
    );

    return;

  }


  const images =
    story.images || [];


  if (!images.length)
    return;


  if (
    currentStoryIndex >=
    images.length
  ) {

    currentStoryIndex =
      images.length - 1;

  }


  document.getElementById(
    "storyViewerImage"
  ).src =
    images[
      currentStoryIndex
    ];


  document.getElementById(
    "storyViewerCaption"
  ).textContent =
    story.caption || "";


  const profile =
    getProfile();


  document.getElementById(
    "storyViewerUsername"
  ).textContent =
    "@" +
    (
      profile.username ||
      "username"
    );


  const avatar =
    document.getElementById(
      "storyViewerAvatar"
    );


  if (profile.avatar) {

    avatar.innerHTML = `

      <img
        class="story-viewer-avatar"
        src="${profile.avatar}"
        alt=""
      >

    `;

  } else {

    avatar.innerHTML = `

      <div
        class="story-viewer-avatar"
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          background:linear-gradient(
            135deg,
            #833ab4,
            #fd1d1d,
            #fcb045
          );
          color:white;
          font-size:12px;
        "
      >
        ${escapeHTML(
          getInitials(
            profile.name
          )
        )}
      </div>

    `;

  }


  const progress =
    document.getElementById(
      "storyProgress"
    );


  progress.innerHTML =
    "";


  images.forEach(
    (_, index) => {

      const bar =
        document.createElement(
          "div"
        );


      bar.className =
        "story-progress-bar";


      if (
        index <=
        currentStoryIndex
      ) {

        bar.classList.add(
          "active"
        );

      }


      progress.appendChild(
        bar
      );

    }
  );

}


/* =================================================
   STORY NEXT
================================================= */

function nextStory() {

  const stories =
    getStories();


  const story =
    stories.find(
      item =>
        item.id ===
        currentStoryId
    );


  if (!story)
    return;


  if (
    currentStoryIndex <
    story.images.length - 1
  ) {

    currentStoryIndex++;

    renderStoryViewer();

    return;

  }


  /*
     If this story is finished,
     move to the next story.
  */

  const index =
    stories.findIndex(
      item =>
        item.id ===
        currentStoryId
    );


  if (
    index <
    stories.length - 1
  ) {

    currentStoryId =
      stories[index + 1].id;

    currentStoryIndex =
      0;

    renderStoryViewer();

  } else {

    closeModal(
      "storyViewerModal"
    );

  }

}


/* =================================================
   STORY PREVIOUS
================================================= */

function previousStory() {

  const stories =
    getStories();


  const story =
    stories.find(
      item =>
        item.id ===
        currentStoryId
    );


  if (!story)
    return;


  if (
    currentStoryIndex > 0
  ) {

    currentStoryIndex--;

    renderStoryViewer();

    return;

  }


  const index =
    stories.findIndex(
      item =>
        item.id ===
        currentStoryId
    );


  if (
    index > 0
  ) {

    currentStoryId =
      stories[index - 1].id;


    const previous =
      stories[index - 1];


    currentStoryIndex =
      previous.images.length - 1;


    renderStoryViewer();

  }

}

document.addEventListener(

/* =================================================
   CAROUSEL
================================================= */

function showLikeAnimation(target) {

  if (!target) return;

  const container = target.closest(".post-detail") || target.closest(".post-card") || target.parentElement;
  if (!container) return;

  if (getComputedStyle(container).position === "static") container.style.position = "relative";

  const heart = document.createElement("div");
  heart.className = "like-burst";
  heart.textContent = "💕";
  container.appendChild(heart);

  target.classList.remove("like-button-pop");
  void target.offsetWidth;
  target.classList.add("like-button-pop");

  setTimeout(() => { heart.remove(); target.classList.remove("like-button-pop"); }, 850);

}

function renderCarousel() {

  const total =
    currentPostImages.length;


  if (!total)
    return;


  document.getElementById(
    "detailImage"
  ).src =
    currentPostImages[
      currentImageIndex
    ];


  document.getElementById(
    "carouselCounter"
  ).textContent =
    `${currentImageIndex + 1} / ${total}`;


  document.getElementById(
    "carouselPrev"
  ).style.display =
    total > 1
      ? "block"
      : "none";


  document.getElementById(
    "carouselNext"
  ).style.display =
    total > 1
      ? "block"
      : "none";


  const dots =
    document.getElementById(
      "carouselDots"
    );


  dots.innerHTML =
    "";


  currentPostImages.forEach(
    (_, index) => {

      const dot =
        document.createElement(
          "div"
        );


      dot.className =
        "carousel-dot";


      if (
        index ===
        currentImageIndex
      ) {

        dot.classList.add(
          "active"
        );

      }


      dots.appendChild(
        dot
      );

    }
  );

}

    );


  if (!theme) {

        "private_profile_theme_v4"
      );

  }


  if (!theme) {

    theme =

      );

  if (

    document.body.classList.add(

  () => {

    document.body.classList.toggle(
      "dark"
    );


    const dark =
      document.body.classList.contains(

/* =================================================
   IMAGE RESIZER
================================================= */

function resizeImage(
  file,
  maxSize
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      if (
        !file ||
        !file.type.startsWith(
          "image/"
        )
      ) {

        reject(
          new Error(
            "Not an image"
          )
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onerror =
        () => {

          reject(
            new Error(
              "Could not read image"
            )
          );

        };


      reader.onload =
        event => {

          const img =
            new Image();


          img.onerror =
            () => {

              reject(
                new Error(
                  "Could not load image"
                )
              );

            };


          img.onload =
            () => {

              let width =
                img.width;

              let height =
                img.height;


              if (
                width > maxSize ||
                height > maxSize
              ) {

                const scale =
                  Math.min(
                    maxSize / width,
                    maxSize / height
                  );


                width =
                  Math.round(
                    width * scale
                  );


                height =
                  Math.round(
                    height * scale
                  );

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.82
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =================================================
   HELPERS
================================================= */

function getInitials(
  name
) {

  if (!name)
    return "Y";


  const parts =
    name
      .trim()
      .split(/\s+/);


  if (
    parts.length === 1
  ) {

    return parts[0]
      .substring(
        0,
        2
      )
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[
      parts.length - 1
    ][0]
  ).toUpperCase();

}


function escapeHTML(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function formatDate(
  date
) {

  if (!date)
    return "";


  const parsed =
    new Date(date);


  if (
    Number.isNaN(
      parsed.getTime()
    )
  )
    return "";


  return parsed.toLocaleDateString(
    undefined,
    {
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  );

}


let toastTimer;


function showToast(
  message
) {

  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}

cleanStories();

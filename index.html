<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #fafafa;
  --card: #fff;
  --text: #111;
  --muted: #737373;
  --border: #dbdbdb;
  --button: #0095f6;
  --input: #f5f5f5;
  --danger: #ed4956;
  --overlay: rgba(0,0,0,.68);
  --shadow: 0 10px 35px rgba(0,0,0,.18);
}

body.dark {
  --bg: #000;
  --card: #121212;
  --text: #f5f5f5;
  --muted: #a8a8a8;
  --border: #363636;
  --input: #1c1c1c;
  --shadow: 0 10px 35px rgba(0,0,0,.55);
}

html,
body {
  min-height: 100%;
}

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

img {
  display: block;
  max-width: 100%;
}


/* =========================================
   TOP BAR
========================================= */

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;

  height: 60px;

  background: var(--card);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  width: min(975px, 100%);
  height: 100%;

  margin: auto;
  padding: 0 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.7px;
}

.brand span {
  font-weight: 400;
}

.top-actions {
  display: flex;
  gap: 6px;
}

.icon-btn {
  width: 40px;
  height: 40px;

  border: 0;
  border-radius: 50%;

  background: transparent;
  color: var(--text);

  font-size: 22px;
}

.icon-btn:hover {
  background: var(--input);
}


/* =========================================
   MAIN
========================================= */

main {
  width: min(975px, 100%);
  margin: auto;

  padding: 20px 20px 80px;
}


/* =========================================
   PROFILE
========================================= */

.profile-header {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 55px;

  padding: 25px 20px 45px;
}

.avatar-wrapper {
  display: flex;
  justify-content: center;
}

.avatar,
.avatar-placeholder {
  width: 150px;
  height: 150px;

  border-radius: 50%;

  border: 3px solid var(--card);
  outline: 1px solid var(--border);
}

.avatar {
  object-fit: cover;
}

.avatar-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #833ab4,
      #fd1d1d,
      #fcb045
    );

  color: white;

  font-size: 45px;
  font-weight: 700;
}

.profile-info {
  min-width: 0;
}

.profile-top {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;

  margin-bottom: 20px;
}

.username {
  font-size: 28px;
  font-weight: 400;
}

.profile-buttons {
  display: flex;
  gap: 8px;
}

.btn {
  border: 0;
  border-radius: 8px;

  padding: 8px 18px;

  background: var(--input);
  color: var(--text);

  font-size: 14px;
  font-weight: 600;
}

.btn:hover {
  opacity: .85;
}

.btn-primary {
  background: var(--button);
  color: white;
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.stats {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 28px;

  margin-bottom: 20px;

  font-size: 15px;
}

.stat strong {
  font-weight: 700;
}

.bio-name {
  margin-bottom: 4px;
  font-weight: 700;
}

.bio {
  max-width: 550px;

  white-space: pre-wrap;

  line-height: 1.45;
}

.private-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;

  margin-top: 12px;

  color: var(--muted);
  font-size: 12px;
}


/* =========================================
   POSTS NAV
========================================= */

.posts-nav {
  display: flex;
  justify-content: center;
  gap: 70px;

  border-top: 1px solid var(--border);
}

.posts-nav button {
  position: relative;

  height: 52px;

  border: 0;
  background: transparent;

  color: var(--muted);

  font-size: 12px;
  font-weight: 600;
  letter-spacing: .5px;
}

.posts-nav button.active {
  color: var(--text);
}

.posts-nav button.active::before {
  content: "";

  position: absolute;
  top: -1px;
  left: 0;
  right: 0;

  height: 1px;

  background: var(--text);
}


/* =========================================
   POSTS
========================================= */

.post-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}

.post {
  position: relative;

  aspect-ratio: 1 / 1;

  overflow: hidden;

  background: var(--input);

  cursor: pointer;
}

.post > img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  transition: transform .25s;
}

.post:hover > img {
  transform: scale(1.035);
}

.post-multiple {
  position: absolute;

  top: 9px;
  right: 10px;

  z-index: 2;

  color: white;

  font-size: 19px;

  text-shadow: 0 1px 5px #000;
}

.post-overlay {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;

  background: rgba(0,0,0,.48);

  color: white;

  opacity: 0;

  transition: opacity .2s;
}

.post:hover .post-overlay {
  opacity: 1;
}

.text-post {
  width: 100%;
  height: 100%;

  padding: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  background:
    linear-gradient(
      135deg,
      #833ab4,
      #fd1d1d
    );

  color: white;

  font-size: 20px;
  font-weight: 600;
}


/* =========================================
   EMPTY
========================================= */

.empty {
  grid-column: 1 / -1;

  padding: 80px 20px;

  text-align: center;
}

.empty-icon {
  width: 65px;
  height: 65px;

  margin: 0 auto 20px;

  border: 2px solid var(--text);
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 30px;
}

.empty h2 {
  margin-bottom: 8px;
}

.empty p {
  margin-bottom: 20px;

  color: var(--muted);
}


/* =========================================
   MODALS
========================================= */

.modal-backdrop {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: var(--overlay);
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: min(520px, 100%);
  max-height: 92vh;

  overflow-y: auto;

  background: var(--card);

  border-radius: 12px;

  box-shadow: var(--shadow);
}

.modal-header {
  min-height: 55px;

  padding: 0 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid var(--border);
}

.modal-header h2 {
  font-size: 16px;
}

.close-btn {
  border: 0;
  background: transparent;

  color: var(--text);

  font-size: 27px;
}

.modal-body {
  padding: 25px;
}

.modal-footer {
  padding: 15px 25px;

  display: flex;
  justify-content: flex-end;
  gap: 10px;

  border-top: 1px solid var(--border);
}


/* =========================================
   FORMS
========================================= */

.form-group {
  margin-bottom: 18px;
}

.form-group label:not(.file-label) {
  display: block;

  margin-bottom: 7px;

  font-size: 13px;
  font-weight: 600;
}

.form-control {
  width: 100%;

  padding: 11px 12px;

  border: 1px solid var(--border);
  border-radius: 7px;

  outline: none;

  background: var(--input);
  color: var(--text);
}

.form-control:focus {
  border-color: var(--muted);
}

textarea.form-control {
  min-height: 100px;
  resize: vertical;
}

.file-label {
  display: block;

  padding: 25px;

  border: 1px dashed var(--border);
  border-radius: 10px;

  text-align: center;

  color: var(--muted);

  cursor: pointer;
}

.file-label:hover {
  background: var(--input);
}

.file-label input {
  display: none;
}


/* =========================================
   PREVIEWS
========================================= */

.preview {
  display: none;

  margin-top: 15px;
}

.preview.show {
  display: block;
}

.preview img {
  width: 100%;
  max-height: 300px;

  object-fit: contain;

  border-radius: 8px;

  background: var(--input);
}

.multi-preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;

  margin-top: 15px;
}

.multi-preview img {
  width: 100%;
  aspect-ratio: 1;

  object-fit: cover;

  border-radius: 6px;
}


/* =========================================
   POST DETAIL
========================================= */

.post-detail {
  width: min(900px, 100%);
}

.post-detail-content {
  display: grid;
  grid-template-columns: 1fr 320px;

  min-height: 450px;
}

.post-carousel {
  position: relative;

  min-height: 450px;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  touch-action: pan-y;
}

.carousel-image {
  width: 100%;
  height: 100%;

  max-height: 650px;

  object-fit: contain;
}

.carousel-arrow {
  position: absolute;

  top: 50%;

  width: 36px;
  height: 36px;

  transform: translateY(-50%);

  border: 0;
  border-radius: 50%;

  background: rgba(255,255,255,.88);
  color: #111;

  font-size: 22px;

  z-index: 5;
}

.carousel-arrow:hover {
  background: white;
}

.carousel-prev {
  left: 12px;
}

.carousel-next {
  right: 12px;
}

.carousel-counter {
  position: absolute;

  top: 12px;
  left: 50%;

  transform: translateX(-50%);

  padding: 5px 10px;

  border-radius: 20px;

  background: rgba(0,0,0,.65);

  color: white;

  font-size: 12px;

  z-index: 5;
}

.carousel-dots {
  position: absolute;

  bottom: 12px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;
  gap: 5px;

  z-index: 5;
}

.carousel-dot {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: rgba(255,255,255,.5);
}

.carousel-dot.active {
  background: white;
}

.post-detail-info {
  padding: 20px;

  display: flex;
  flex-direction: column;
}

.post-detail-caption {
  margin-top: 20px;

  line-height: 1.5;

  white-space: pre-wrap;
}

.post-detail-likes {
  margin-top: 15px;

  font-weight: 600;
}

.post-detail-date {
  margin-top: auto;
  padding-top: 20px;

  color: var(--muted);

  font-size: 12px;
}


/* =========================================
   TOAST
========================================= */

.toast {
  position: fixed;

  bottom: 25px;
  left: 50%;

  z-index: 200;

  transform:
    translateX(-50%)
    translateY(20px);

  padding: 12px 18px;

  border-radius: 8px;

  background: #262626;
  color: white;

  font-size: 14px;

  opacity: 0;

  pointer-events: none;

  transition: .25s;
}

.toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

  main {
    padding: 5px 0 60px;
  }

  .profile-header {
    grid-template-columns: 90px 1fr;

    gap: 20px;

    padding: 20px 15px 30px;
  }

  .avatar,
  .avatar-placeholder {
    width: 80px;
    height: 80px;

    font-size: 27px;
  }

  .username {
    font-size: 20px;
  }

  .profile-top {
    gap: 10px;

    margin-bottom: 12px;
  }

  .profile-buttons {
    width: 100%;
  }

  .profile-buttons .btn {
    flex: 1;
  }

  .stats {
    gap: 14px;

    font-size: 13px;

    margin-bottom: 12px;
  }

  .posts-nav {
    gap: 45px;
  }

  .post-grid {
    gap: 2px;
  }

  .post-detail-content {
    grid-template-columns: 1fr;
  }

  .post-carousel {
    min-height: 350px;
  }

  .post-detail-info {
    min-height: 250px;
  }
}
</style>
</head>

<!-- MAIN -->

<main>

</div>


<!-- POST DETAIL -->

<div
  class="modal-backdrop"
  id="detailModal"
>

<script>

/* =================================================
   PRIVATE PROFILE APP
   Everything is stored in localStorage.
================================================= */


/* =================================================
   STORAGE
================================================= */

const PROFILE_KEY = "private_profile_data_v4";
const POSTS_KEY = "private_profile_posts_v4";
const THEME_KEY = "private_profile_theme_v4";


/* =================================================
   DEFAULT PROFILE
================================================= */

const defaultProfile = {
  name: "Your Name",
  username: "username",
  bio: "Welcome to my private profile. ✨",
  avatar: null,
  followers: 17000,
  following: 851
};


/* =================================================
   SAFE JSON
================================================= */

function readJSON(key) {

  try {

    const value = localStorage.getItem(key);

    if (!value) {
      return null;
    }

    return JSON.parse(value);

  } catch (error) {

    console.error(
      "Could not read storage:",
      error
    );

    return null;
  }
}


function writeJSON(key, value) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

    return true;

  } catch (error) {

    console.error(
      "Could not save:",
      error
    );

    return false;
  }
}


/* =================================================
   MIGRATE OLD PROFILE DATA
================================================= */

function getProfile() {

  let saved =
    readJSON(PROFILE_KEY);


  /*
     If the new storage doesn't exist,
     look for the older versions.
  */

  if (!saved) {

    saved =
      readJSON(
        "private_profile_data_v3"
      );

  }


  if (!saved) {

    saved = {};

  }


  const profile = {
    ...defaultProfile,
    ...saved
  };


  /*
     Make sure the requested numbers
     always exist.
  */

  if (
    typeof profile.followers !== "number"
  ) {

    profile.followers = 17000;

  }


  if (
    typeof profile.following !== "number"
  ) {

    profile.following = 851;

  }


  /*
     Save migrated profile immediately.
  */

  writeJSON(
    PROFILE_KEY,
    profile
  );


  return profile;
}


/* =================================================
   POSTS
================================================= */

function normalizePost(post) {

  /*
     Older version used:
        image: "..."

     New version uses:
        images: ["...", "..."]
  */

  let images = [];

  if (
    Array.isArray(post.images)
  ) {

    images =
      post.images.filter(Boolean);

  } else if (
    post.image
  ) {

    images = [
      post.image
    ];

  }


  return {

    id:
      post.id ||
      Date.now().toString(),

    images:

      images,

    caption:
      post.caption ||
      "",

    likes:
      Number.isFinite(
        Number(post.likes)
      )
        ? Number(post.likes)
        : 0,

    createdAt:
      post.createdAt ||
      new Date().toISOString()

  };
}


function getPosts() {

  let posts =
    readJSON(POSTS_KEY);


  /*
     Migrate posts from v3.
  */

  if (!Array.isArray(posts)) {

    posts =
      readJSON(
        "private_profile_posts_v3"
      );

  }


  if (!Array.isArray(posts)) {

    posts = [];

  }


  posts =
    posts.map(
      normalizePost
    );


  /*
     Save normalized data.
     This means old single-image posts
     are converted to the new format.
  */

  writeJSON(
    POSTS_KEY,
    posts
  );


  return posts;
}


function savePosts(posts) {

  const normalized =
    posts.map(
      normalizePost
    );


  const saved =
    writeJSON(
      POSTS_KEY,
      normalized
    );


  if (!saved) {

    showToast(
      "Could not save. Your browser may be out of storage."
    );

  }


  return saved;
}

/* =================================================
   NUMBER FORMAT
================================================= */

function formatFollowers(number) {

  number =
    Number(number) || 0;


  if (number >= 1000000) {

    const value =
      number / 1000000;

    return (
      value
        .toFixed(
          value % 1 === 0
            ? 0
            : 1
        )
      + "M"
    );

  }


  if (number >= 1000) {

    const value =
      number / 1000;

    return (
      value
        .toFixed(
          value % 1 === 0
            ? 0
            : 1
        )
      + "K"
    );

  }


  return number.toLocaleString();
}

function renderPosts() {

      <div class="empty">

        <div class="empty-icon">
          📷

    document
      .getElementById(

  posts.forEach(post => {

      document.createElement(

      );

        );


      text.className =
        "text-post";


      text.textContent =
        post.caption ||

      element.appendChild(

      images.length > 1

        document.createElement(
          "div"
        );


      multiple.className =
        "post-multiple";


      multiple.textContent =
        "▧";


      element.appendChild(
        multiple
      );

    }


    const overlay =
      document.createElement(
        "div"
      );


    overlay.className =
      "post-overlay";


    overlay.innerHTML = `

      <span>
        ♥ ${post.likes}
      </span>

      <span>
        ${
          images.length > 1
            ? "📷 " + images.length

      overlay
    );

      "click",

}

function renderCarousel() {

  const total =
    currentPostImages.length;


  if (!total) {

    document.getElementById(
      "detailImage"
    ).removeAttribute(
      "src"
    );

    return;

  }


  document.getElementById(
    "detailImage"
  ).src =
    currentPostImages[
      currentImageIndex
    ];


  document.getElementById(
    "carouselCounter"
  ).textContent =
    `${currentImageIndex + 1} / ${total}`;


  const previous =
    document.getElementById(
      "carouselPrev"
    );

  const next =
    document.getElementById(
      "carouselNext"
    );


  previous.style.display =
    total > 1
      ? "block"
      : "none";


  next.style.display =
    total > 1
      ? "block"
      : "none";


  const dots =
    document.getElementById(
      "carouselDots"
    );


  dots.innerHTML = "";


  if (total > 1) {

    currentPostImages.forEach(
      (_, index) => {

        const dot =
          document.createElement(
            "div"
          );


        dot.className =
          "carousel-dot";


        if (
          index ===
          currentImageIndex
        ) {

          dot.classList.add(
            "active"
          );

        }


        dots.appendChild(
          dot
        );

      }
    );

  }

}

      currentImageIndex =

let touchStartX = 0;


const postCarousel =
  document.getElementById(
    "postCarousel"
  );


postCarousel.addEventListener(
  "touchstart",
  event => {

    touchStartX =
      event.changedTouches[0]
        .screenX;

  },
  {
    passive: true
  }
);


postCarousel.addEventListener(
  "touchend",
  event => {

    const touchEndX =
      event.changedTouches[0]
        .screenX;


    const difference =
      touchStartX -
      touchEndX;


    if (
      Math.abs(difference) <
      40
    )
      return;


    if (
      difference > 0
    ) {

      document.getElementById(
        "carouselNext"
      ).click();

    } else {

      document.getElementById(
        "carouselPrev"
      ).click();

    }

  },
  {
    passive: true
  }
);

/* =================================================
   IMAGE RESIZER
================================================= */

function resizeImage(
  file,
  maxSize
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      if (
        !file ||
        !file.type.startsWith(
          "image/"
        )
      ) {

        reject(
          new Error(
            "Not an image"
          )
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onerror =
        () => {

          reject(
            new Error(
              "Could not read file"
            )
          );

        };


      reader.onload =
        event => {

          const img =
            new Image();


          img.onerror =
            () => {

              reject(
                new Error(
                  "Could not load image"
                )
              );

            };


          img.onload =
            () => {

              let width =
                img.width;

              let height =
                img.height;


              if (
                width > maxSize ||
                height > maxSize
              ) {

                const scale =
                  Math.min(
                    maxSize / width,
                    maxSize / height
                  );


                width =
                  Math.round(
                    width * scale
                  );


                height =
                  Math.round(
                    height * scale
                  );

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.82
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =================================================
   HELPERS
================================================= */

function getInitials(name) {

  if (!name)
    return "Y";


  const parts =
    name
      .trim()
      .split(/\s+/);


  if (
    parts.length === 1
  ) {

    return parts[0]
      .substring(
        0,
        2
      )
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[
      parts.length - 1
    ][0]
  ).toUpperCase();

}


function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function formatDate(date) {

  if (!date)
    return "";


  const parsed =
    new Date(date);


  if (
    Number.isNaN(
      parsed.getTime()
    )
  )
    return "";


  return parsed.toLocaleDateString(
    undefined,
    {
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  );

}


let toastTimer;


function showToast(message) {

  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}


/* =================================================
   START APP
================================================= */

loadTheme();

getProfile();

getPosts();

render();

</script>

body.dark {

  --border: #363636;

}

html {

}

}

button,
input,

button {

img {

   TOP BAR
================================ */

<script>

/* ==================================================
   PRIVATE PROFILE APPLICATION

   Everything is stored locally in the browser.

   No server.
   No database.
   No public profile.
================================================== */


/* ================================================
   STORAGE KEYS
================================================ */

const PROFILE_KEY =
  "private_profile_data_v3";

const POSTS_KEY =
  "private_profile_posts_v3";

const THEME_KEY =
  "private_profile_theme_v3";


/* ================================================
   DEFAULT PROFILE
================================================ */

const defaultProfile = {

  name: "Your Name",

  username: "username",

  bio: "Welcome to my private profile. ✨",

  avatar: null,

  followers: 17000,

  following: 851

};


/* ================================================
   PROFILE STORAGE
================================================ */

function getProfile() {

  try {

    const saved =
      localStorage.getItem(PROFILE_KEY);

    if (!saved) {

      saveProfile(defaultProfile);

      return {
        ...defaultProfile
      };

    }

    return {
      ...defaultProfile,
      ...JSON.parse(saved)
    };

  } catch {

    return {
      ...defaultProfile
    };

  }

}


function saveProfile(profile) {

  localStorage.setItem(
    PROFILE_KEY,
    JSON.stringify(profile)
  );

}


/* ================================================
   POST STORAGE
================================================ */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem(POSTS_KEY)
    ) || [];

  } catch {

    return [];

  }

}


function savePosts(posts) {

  localStorage.setItem(
    POSTS_KEY,
    JSON.stringify(posts)
  );

}

   ELEMENTS
================================================ */

/* ================================================
   RENDER POSTS
================================================ */

function renderPosts() {

  const posts =
    getPosts();

  postGrid.innerHTML = "";


  if (!posts.length) {

    postGrid.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📷
        </div>

        <h2>
          Share your first photo
        </h2>

        <p>
          When you add posts,

        <button
          class="btn btn-primary"
          onclick="openPostModal()"
        >

        </button>

      </div>

    `;

    return;

  }

    const element =
      document.createElement("article");

    element.className =
      "post";


    const images =
      Array.isArray(post.images)
        ? post.images
        : [post.image];


    const firstImage =
      images[0];


    element.innerHTML = `

      ${
        firstImage

          ? `

            <img
              src="${firstImage}"
              alt="${escapeHTML(
                post.caption || "Post"
              )}"
              loading="lazy"
            >

          `

          : `

            <div class="text-post">
              ${escapeHTML(
                post.caption || ""
              )}
            </div>

          `
      }


      ${
        images.length > 1

          ? `

            <div class="post-multiple">
              ▧
            </div>

          `

          : ""
      }


      <div class="post-overlay">

        <span>
          ♥ ${post.likes || 0}

        <span>
          ${
            images.length > 1
              ? `📷 ${images.length}`
              : "📷"
          }
        </span>

      </div>

    `;


    element.addEventListener(
      "click",
      () => openPostDetail(post.id)
    );


    postGrid.appendChild(element);

  });

}

document
  .getElementById("postImage")
  .addEventListener(

    function() {

      const files =
        Array.from(this.files);

      selectedPostImages = [];

        resizeImage(
          file,
          1400,
          dataURL => {

            selectedPostImages.push(

            loaded++;

              loaded === files.length
            ) {

              renderPostPreview();

            }

          }
        );

    }

let selectedPostId = null;

let currentPostImages = [];

let currentImageIndex = 0;


/* ================================================
   OPEN POST
================================================ */

function openPostDetail(id) {

  const posts =
    getPosts();


  const post =
    posts.find(
      p => p.id === id
    );


  if (!post) return;


  selectedPostId =
    id;


  currentPostImages =
    Array.isArray(post.images)
      ? post.images
      : [post.image];


  currentImageIndex =
    0;


  document.getElementById(
    "detailUsername"
  ).textContent =
    "@" + getProfile().username;


  document.getElementById(
    "detailCaption"
  ).textContent =
    post.caption || "";


  document.getElementById(
    "detailLikes"
  ).textContent =
    `♥ ${post.likes || 0} ${
      (post.likes || 0) === 1
        ? "like"
        : "likes"
    }`;


  document.getElementById(
    "detailDate"
  ).textContent =
    formatDate(
      post.createdAt
    );


  renderCarousel();


  openModal(
    "detailModal"
  );

}


/* ================================================
   CAROUSEL
================================================ */

function renderCarousel() {

  const total =
    currentPostImages.length;


  const image =
    currentPostImages[
      currentImageIndex
    ];


  document.getElementById(
    "detailImage"
  ).src =
    image;


  document.getElementById(
    "carouselCounter"
  ).textContent =
    `${currentImageIndex + 1} / ${total}`;


  const prev =
    document.getElementById(
      "carouselPrev"
    );

  const next =
    document.getElementById(
      "carouselNext"
    );


  prev.style.display =
    total > 1
      ? "block"
      : "none";


  next.style.display =
    total > 1
      ? "block"
      : "none";


  const dots =
    document.getElementById(
      "carouselDots"
    );


  dots.innerHTML = "";


  if (total > 1) {

    currentPostImages.forEach(
      (_, index) => {

        const dot =
          document.createElement(
            "div"
          );


        dot.className =
          "carousel-dot";


        if (
          index ===
          currentImageIndex
        ) {

          dot.classList.add(
            "active"
          );

        }


        dots.appendChild(dot);

      }
    );

  }

}


/* ================================================
   CAROUSEL NEXT / PREVIOUS
================================================ */

document
  .getElementById("carouselNext")
  .addEventListener(
    "click",
    event => {

      event.stopPropagation();


      if (
        currentPostImages.length <= 1
      ) return;


      currentImageIndex =
        (
          currentImageIndex + 1
        ) %
        currentPostImages.length;


      renderCarousel();

    }
  );


document
  .getElementById("carouselPrev")
  .addEventListener(
    "click",
    event => {

      event.stopPropagation();


      if (
        currentPostImages.length <= 1
      ) return;


      currentImageIndex =
        (
          currentImageIndex - 1 +
          currentPostImages.length
        ) %
        currentPostImages.length;


      renderCarousel();

    }
  );

================================================ */

let touchStartX = 0;


const carousel =
  document.getElementById(
    "postCarousel"
  );


carousel.addEventListener(
  "touchstart",
  event => {

    touchStartX =
      event.changedTouches[0].screenX;

  },
  { passive: true }
);


carousel.addEventListener(
  "touchend",
  event => {

    const touchEndX =
      event.changedTouches[0].screenX;


    const difference =
      touchStartX - touchEndX;


    if (
      Math.abs(difference) < 40
    ) return;


    if (difference > 0) {

      document
        .getElementById(
          "carouselNext"
        )
        .click();

    } else {

      document
        .getElementById(
          "carouselPrev"
        )
        .click();

    }

  { passive: true }
);

/* ================================================
   IMAGE RESIZER
================================================ */

function resizeImage(
  file,
  maxSize,
  callback
) {

  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    showToast(
      "Please choose an image."
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    event => {

      const img =
        new Image();


      img.onload =
        () => {

          let width =
            img.width;

          let height =
            img.height;


          if (
            width > maxSize ||
            height > maxSize
          ) {

            const scale =
              Math.min(
                maxSize / width,
                maxSize / height
              );


            width *= scale;
            height *= scale;

          }


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            Math.round(width);

          canvas.height =
            Math.round(height);


          const context =
            canvas.getContext(
              "2d"
            );


          context.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );


          callback(
            canvas.toDataURL(
              "image/jpeg",
              0.82
            )
          );

        };


      img.src =
        event.target.result;

    };


  reader.readAsDataURL(
    file
  );

}


/* ================================================
   HELPERS
================================================ */

function getInitials(name) {

  if (!name)
    return "Y";


  const parts =
    name
      .trim()
      .split(/\s+/);


  if (
    parts.length === 1
  ) {

    return parts[0]
      .substring(0, 2)
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();

}


function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function formatDate(date) {

  return new Date(
    date
  ).toLocaleDateString(
    undefined,
    {
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  );

}


function showToast(message) {

  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },
    2500
  );

}
